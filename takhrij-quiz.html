*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:AmiriQ,Amiri,'Noto Naskh Arabic',serif;background:#f6f2e7;color:#222;font-size:18px}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 40px}
header.top{background:#1b4d3e;color:#fff;border-radius:14px;padding:12px 16px;text-align:center}
header.top h1{margin:0;font-size:26px}header.top p{margin:2px 0 0;color:#e8d9a8;font-size:15px}
.panel{background:#fff;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{display:block;margin:8px 0 4px;font-weight:700;color:#1b4d3e}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=number]{width:90px;font:inherit;padding:6px 8px;border:1px solid #ccc;border-radius:8px;text-align:center}
.seg{display:flex;border:1px solid #1b4d3e;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;color:#1b4d3e;font:inherit;padding:8px;cursor:pointer}
.seg button.on{background:#1b4d3e;color:#fff}
.big{display:block;width:100%;margin-top:14px;border:0;border-radius:12px;background:#b08a3e;color:#fff;font:inherit;font-size:21px;font-weight:700;padding:12px;cursor:pointer}
.big.alt{background:#1b4d3e}.big.gray{background:#777}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{color:#fff;border-radius:20px;padding:2px 10px;font-size:14px;font-weight:700}
.stat{display:flex;justify-content:space-between;font-size:15px;color:#555;margin-top:10px}
.bar{height:7px;background:#e6dfcb;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#1b7a4b;width:0}
.card{background:#fff;border-radius:14px;border-right:6px solid #b08a3e;padding:12px 14px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hd{display:flex;gap:10px;align-items:center}
.num{background:#1b4d3e;color:#fff;font-weight:700;font-size:20px;min-width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tt{font-weight:700;font-size:19px}.who{color:#666;font-size:15px}
.txt{line-height:2;font-size:19px;margin-top:8px;text-align:justify}
.q{color:#0f3d2e;font-weight:700}
.hide{background:#eee;border:1px dashed #999;color:#777;border-radius:6px;padding:0 8px;font-weight:700;white-space:nowrap}
mark{border-radius:5px;padding:0 4px;font-weight:700}
.rev{text-align:center;padding:24px 0}.rev .num{margin:0 auto;width:96px;height:96px;font-size:40px}
.rev p{font-size:22px;margin:12px 0 0;color:#1b4d3e;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts button{border:0;border-radius:12px;color:#fff;font:inherit;font-weight:700;font-size:17px;padding:11px 6px;cursor:pointer;line-height:1.4}
.opts button.wide{grid-column:1/3}
.opts button:disabled{opacity:.35}.opts button.right{opacity:1;outline:4px solid #111;outline-offset:-4px}.opts button.picked{opacity:1}
.fb{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:18px}
.fb.ok{background:#e6f4ec;color:#145c38}.fb.no{background:#fbe9e7;color:#9a2a1a}
.fb b{display:block;font-size:20px}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.wl span{border-radius:8px;color:#fff;padding:2px 9px;font-weight:700}
.hidden{display:none}
.res{text-align:center}.res .sc{font-size:44px;font-weight:700;color:#1b4d3e}
small.n{color:#888}

<header class="top"><h1>اختبار التخريج</h1><p>رياض الصالحين · الأحاديث ١–١٠٠ (٩٩ حديثًا)</p></header>

<div id="setup" class="panel">
 <label>النطاق</label>
 <div class="row">من <input id="from" type="number" min="1" max="100" value="1"> إلى <input id="to" type="number" min="1" max="100" value="100"></div>
 <label>طريقة العرض</label>
 <div class="seg" id="mode"><button data-v="text" class="on">نص الحديث</button><button data-v="num">الرقم فقط (عكسي)</button></div>
 <label>الترتيب</label>
 <div class="seg" id="order"><button data-v="shuf" class="on">عشوائي</button><button data-v="seq">بالترتيب</button></div>
 <button class="big" id="start">ابدأ الاختبار</button>
 <button class="big alt hidden" id="startWrong">أعِد الأخطاء المحفوظة (<span id="wc"></span>)</button>
 <div class="legend" id="legend"></div>
 <p style="font-size:14px;color:#777;margin:10px 0 0">الحديث ٨٨ غير داخل؛ لأنه إحالة إلى الحديث ٦٧ وليس له تخريج في موضعه.</p>
</div>

<div id="quiz" class="hidden">
 <div class="stat"><span id="pos"></span><span id="score"></span></div>
 <div class="bar"><i id="barI"></i></div>
 <div class="card" id="card"></div>
 <div class="opts" id="opts"></div>
 <div id="fb"></div>
 <button class="big alt hidden" id="next">التالي ←</button>
 <button class="big gray" id="quit" style="font-size:16px;padding:8px">إنهاء</button>
</div>

<div id="result" class="panel res hidden">
 <div>نتيجتك</div><div class="sc" id="final"></div><div id="pct"></div>

 <button class="big" id="again">اختبار جديد</button>
</div>

بْنُ جَبَلٍ رضي الله عنه: بِئْسَمَا قُلْتَ! واللهِ يا رَسُولَ اللهِ مَا عَلِمْنَا عَلَيْهِ إلَّا خَيْرًا. فَسَكَتَ رَسُولُ اللهِ ﷺ. فَبَيْنَا هُوَ عَلى ذَلِكَ رَأى رَجُلًا مُبَيِّضًا يَزُولُ بِهِ السَّرَابُ فَقَالَ رَسُولُ اللهِ ﷺ: «كُنْ أَبَا خَيْثَمَةَ» فَإذَا هُوَ أَبُو خَيْثَمَةَ الأنْصَارِيُّ، وَهُوَ الَّذِي تَصَدَّقَ بِصَاعِ التَّمْرِ حِيْنَ لَمَزَهُ المُنَافِقُونَ. قَالَ كَعْبٌ: فَلَمَّا بَلَغَنِي أنَّ رَسُولَ اللهِ ﷺ قَدْ تَوَجَّهَ قَافِلًا مِنْ تَبُوكَ حَضَرَنِي بَثِّي، فَطَفِقْتُ أَتَذَكَّرُ الكَذِبَ، وأقُولُ: بِمَ أخْرُجُ مِنْ سَخَطِهِ غَدًا؟ وأَسْتَعِيْنُ عَلى ذَلِكَ بِكُلِّ ذِي رأْيٍ مِنْ أهْلِي، فَلَمَّا قِيلَ: إنَّ رَسُولَ اللهِ ﷺ قد أظَلَّ قَادِمًا. زَاحَ عَنِّي البَاطِلُ، حَتَّى عَرَفْتُ أنِّي لَنْ أنْجُوَ مِنْهُ بِشَيءٍ أبَدًا، فَأجْمَعْتُ صِدْقَهُ. وصَبَّحَ رَسُولُ اللهِ ﷺ قَادِمًا، وكَانَ إذَا قَدِمَ مِنْ سَفَرٍ بَدَأَ بالمَسْجِدِ فَرَكَعَ فِيهِ رَكْعَتَيْنِ ثُمَّ جَلَسَ لِلنَّاسِ، فَلَمَّا فَعَلَ ذلِكَ جاءهُ المُخَلَّفُونَ يَعْتَذِرونَ إلَيْهِ ويَحْلِفُونَ لَهُ، وَكَانُوا بِضْعًا وَثَمانينَ رَجُلًا، فَقَبِلَ مِنْهُمْ عَلانِيَتَهُمْ وَبَايَعَهُمْ واسْتَغْفَرَ لَهُمْ، وَوَكَلَ سَرَائِرَهُمْ إلى الله تعالى، حَتَّى جِئْتُ، فَلَمَّا سَلَّمْتُ تَبَسَّمَ تَبَسُّمَ المُغْضَبِ ثُمَّ قَالَ: «تَعَالَ» فَجِئْتُ أمْشِي حَتَّى جَلَسْتُ بَيْنَ يَدَيْهِ، فقالَ لي: «مَا خَلَّفَكَ؟ أَلَمْ تَكُنْ قَدِ ابْتَعْتَ ظَهْرَكَ؟» قَالَ: قُلْتُ: يَا رسولَ اللهِ، إنِّي واللهِ لَوْ جَلَسْتُ عِنْدَ غَيْرِكَ مِنْ أهْلِ الدُّنْيَا لَرَأيتُ أنِّي سَأخْرُجُ مِنْ سَخَطِهِ بعُذْرٍ؛ لَقَدْ أُعْطِيتُ جَدَلًا، ولكنِّي واللهِ لَقَدْ عَلِمْتُ لَئِنْ حَدَّثْتُكَ اليومَ حَدِيثَ كَذِبٍ تَرْضَى به عنِّي، لَيُوشِكَنَّ اللهُ يُسْخِطُكَ عَلَيَّ، وإنْ حَدَّثْتُكَ حَديثَ صِدقٍ تَجِدُ عَلَيَّ فِيهِ إنِّي لَأَرْجُو فِيهِ عُقْبَى الله عَزَّ وَجَلَّ، واللهِ ما كَانَ لي مِنْ عُذْرٍ، واللهِ مَا كُنْتُ قَطُّ أَقْوَى وَلَا أَيْسَرَ مِنِّي حِينَ تَخَلَّفْتُ عَنْكَ. قَالَ: فقالَ رسولُ الله ﷺ: «أَمَّا هَذَا فقَدْ صَدَقَ، فَقُمْ حَتَّى يَقْضِيَ اللهُ فيكَ». وَثَارَ رِجَالٌ مِنْ بَنِي سَلِمَةَ، فاتَّبَعُوني فَقالُوا لِي: واللهِ مَا عَلِمْنَاكَ أَذْنَبْتَ ذَنْبًا قَبْلَ هذَا، لَقَدْ عَجَزْتَ في أَلَّا تَكونَ اعتَذَرْتَ إلَى رسُولِ الله ﷺ بما اعْتَذَرَ إليهِ المُخَلَّفُونَ، فَقَدْ كَانَ كَافِيَكَ ذَنْبَكَ اسْتِغْفَارُ رسُولِ الله ﷺ لَكَ. قَالَ: فَواللهِ ما زَالُوا يُؤَنِّبُونَنِي حَتَّى أَرَدْتُ أَنْ أَرْجِعَ إِلَى رسولِ الله ﷺ فأُكَذِّبَ نَفْسِي، ثُمَّ قُلْتُ لَهُمْ: هَلْ لَقِيَ هذَا مَعِيَ مِنْ أَحَدٍ؟ قَالُوا: نَعَمْ، لَقِيَهُ مَعَكَ رَجُلانِ قَالَا مِثْلَ مَا قُلْتَ، وَقِيلَ لَهُمَا مِثْلُ مَا قِيلَ لَكَ. قَالَ: قُلْتُ: مَنْ هُما؟ قَالُوا: مُرَارَةُ ابْنُ رَبيعَةَ العَامِرِيُّ، وهِلَالُ بنُ أُمَيَّةَ الوَاقِفِيُّ. قَالَ: فَذَكَرُوا لِي رَجُلَينِ صَالِحَينِ قَدْ شَهِدَا بَدْرًا، فِيهِما أُسْوَةٌ. قَالَ: فَمَضَيْتُ حِينَ ذَكَرُوهُما لِي. ونَهَى رَسُولُ الله ﷺ عَنْ كَلامِنا -أيُّهَا الثَّلاثَةُ- مِنْ بَيْنِ مَنْ تَخَلَّفَ عَنْهُ. قال: فاجْتَنَبَنَا النَّاسُ. أوْ قَالَ: تَغَيَّرُوا لَنَا، حَتَّى تَنَكَّرَتْ لي في نَفْسي الأَرْضُ، فَمَا هِيَ بالأرضِ الَّتي أعْرِفُ، فَلَبِثْنَا عَلَى ذلِكَ خَمْسِينَ لَيْلَةً. فَأمَّا صَاحِبَايَ فَاسْتَكَانا وقَعَدَا في بُيُوتِهِمَا يَبْكيَانِ، وأمَّا أنَا فَكُنْتُ أَشَبَّ القَومِ وأَجْلَدَهُمْ، فَكُنْتُ أَخْرُجُ فَأشْهَدُ الصَّلاةَ، وأَطُوفُ في الأَسْواقِ، وَلَا يُكَلِّمُني أَحَدٌ، وَآتِي رسولَ الله ﷺ فأُسَلِّمُ عَلَيْهِ، وَهُوَ في مَجْلِسِهِ بَعْدَ الصَّلاةِ، فَأَقُولُ في نَفسي: هَلْ حَرَّكَ شَفَتَيْهِ بِرَدِّ السَّلامِ أَمْ لَا؟ ثُمَّ أُصَلِّي قَرِيبًا مِنْهُ فَأُسَارِقُهُ النَّظَرَ، فإذَا أَقْبَلْتُ عَلَى صَلاتِي نَظَرَ إلَيَّ، وَإذَا التَفَتُّ نَحْوَهُ أعْرَضَ عَنِّي. حَتَّى إذَا طَالَ عَلَيَّ ذلِكَ مِنْ جَفْوَةِ المُسْلِمِينَ مَشَيْتُ، حَتَّى تَسَوَّرْتُ جِدارَ حائِطِ أبي قَتَادَةَ وَهُوَ ابْنُ عَمِّي وأَحَبُّ النَّاسِ إِلَيَّ، فَسَلَّمْتُ عَلَيهِ، فَوَاللهِ مَا رَدَّ عَلَيَّ السَّلامَ، فَقُلْتُ لَهُ: يَا أبَا قَتَادَةَ، أنْشُدُكَ باللهِ هَلْ تَعْلَمُنِي أُحِبُّ اللهَ وَرَسُولَهُ ﷺ؟ فَسَكَتَ، فَعُدْتُ فَنَاشَدْتُهُ، فَسَكَتَ، فَعُدْتُ فَنَاشَدْتُهُ، فَقَالَ: اللهُ وَرَسُولُهُ أعْلَمُ. فَفَاضَتْ عَيْنَايَ، وَتَوَلَّيْتُ حَتَّى تَسَوَّرْتُ الجِدارَ. فَبَيْنَا أَنَا أَمْشِي في سُوقِ المَدِينَةِ، إذَا نَبَطِيٌّ مِنْ نَبَطِ الشَّامِ، مِمَّنْ قَدِمَ بالطَّعَامِ يَبِيعُهُ بالمَدِينَةِ، يَقُولُ: مَنْ يَدُلُّ عَلَى كَعْبِ بْنِ مَالِكٍ؟ فَطَفِقَ النَّاسُ يُشِيرُونَ لَهُ إلَيَّ، حَتَّى جَاءنِي، فَدَفَعَ إِلَيَّ كِتَابًا مِنْ مَلِكِ غَسَّانَ، وَكُنْتُ كَاتبًا، فَقَرَأْتُهُ فإذَا فِيهِ: أَمَّا بَعْدُ، فإنَّهُ قَدْ بَلَغَنا أنَّ صَاحِبَكَ قَدْ جَفَاكَ، وَلَمْ يَجْعَلْكَ اللهُ بدَارِ هَوانٍ وَلَا مَضْيَعَةٍ، فَالحَقْ بنَا نُوَاسِكَ. فَقُلْتُ حِينَ قَرَأْتُهَا: وَهَذِهِ أَيضًا مِنَ البَلاءِ. فَتَيَمَّمْتُ بِهَا التَّنُّورَ فَسَجَرْتُهَا. حَتَّى إذَا مَضَتْ أَرْبَعُونَ مِنَ الخَمْسِينَ وَاسْتَلْبَثَ الوَحْيُ إذَا رسولُ رسولِ الله ﷺ يَأتِيني، فَقَالَ: إنَّ رسولَ الله ﷺ يَأمُرُكَ أنْ تَعْتَزِلَ امْرَأَتَكَ. فَقُلْتُ: أُطَلِّقُهَا أمْ مَاذَا أفْعَلُ؟ فَقَالَ: لَا، بَلِ اعْتَزِلْهَا وَلَا تَقْرَبَنَّهَا. وَأَرْسَلَ إِلَى صَاحِبَيَّ بِمِثْلِ ذلِكَ، فَقُلْتُ لِامْرَأَتِي: الحَقِي بِأَهْلِكِ، فَكُونِي عِنْدَهُمْ حَتَّى يَقْضِيَ اللهُ في هَذَا الأمْرِ. فَجَاءتِ امْرَأَةُ هِلالِ بْنِ أُمَيَّةَ رسولَ الله ﷺ فَقَالَتْ لَهُ: يَا رَسُولَ اللهِ، إنَّ هِلَالَ بْنَ أُمَيَّةَ شَيْخٌ ضَائِعٌ، وَلَيْسَ لَهُ خَادِمٌ، فَهَلْ تَكْرَهُ أَنْ أخْدُمَهُ؟ قَالَ: «لا، وَلَكِنْ لَا يَقْرَبَنَّكِ» فَقَالَتْ: إنَّهُ واللهِ ما بِهِ مِنْ حَرَكَةٍ إلَى شَيْءٍ، وَوَاللهِ مَا زَالَ يَبْكِي مُنْذُ كَانَ مِنْ أمْرِهِ مَا كَانَ إلَى يَومِهِ هَذَا. فَقَالَ لي بَعْضُ أهْلِي: لَوِ اسْتَأْذَنْتَ رسولَ الله ﷺ في امْرَأَتِكَ! فَقَدْ أَذِنَ لامْرَأَةِ هِلالِ بْنِ أُمَيَّةَ أنْ تَخْدُمَهُ. فَقُلْتُ: لَا أَسْتَأْذِنُ فيها رسولَ الله ﷺ؛ وَمَا يُدْرِيني مَاذَا يقُولُ رسولُ الله ﷺ إذَا اسْتَأْذَنْتُهُ فِيهَا وَأَنَا رَجُلٌ شَابٌّ! فَلَبِثْتُ بِذَلِكَ عَشْرَ لَيَالٍ، فَكَمُلَ لَنَا خَمْسُونَ لَيْلَةً مِنْ حِينَ نُهِيَ عَنْ كَلَامِنا، ثُمَّ صَلَّيْتُ صَلاةَ الفَجْرِ صَبَاحَ خَمْسِينَ لَيْلَةً عَلَى ظَهْرِ بَيْتٍ مِنْ بُيُوتِنَا، فَبَيْنَا أنا جَالِسٌ عَلَى الحالِ الَّتي قَدْ ذَكَرَ اللهُ تعالى مِنَّا، قَدْ ضَاقَتْ عَلَيَّ نَفْسي وَضَاقَتْ عَلَيَّ الأَرْضُ بِمَا رَحُبَتْ، سَمِعْتُ صَوْتَ صَارِخٍ أَوفَى عَلَى سَلْعٍ يَقُولُ بِأَعْلَى صَوتِهِ: يَا كَعْبَ بْنَ مَالِكٍ، أَبْشِرْ. فَخَرَرْتُ سَاجِدًا، وَعَرَفْتُ أَنَّهُ قَدْ جَاءَ فَرَجٌ، فَآذَنَ رسولُ الله ﷺ النَّاسَ بِتَوْبَةِ اللهِ تعالى عَلَيْنَا حِينَ صَلَّى صَلاةَ الفَجْرِ. فَذَهَبَ النَّاسُ يُبَشِّرُونَنَا، فَذَهَبَ قِبَلَ صَاحِبَيَّ مُبَشِّرونَ، وَرَكَضَ رَجُلٌ إِلَيَّ فَرَسًا وَسَعَى سَاعٍ مِنْ أَسْلَمَ قِبَلِي وَأَوْفَى عَلَى الجَبَلِ، فَكَانَ الصَّوْتُ أَسْرَعَ مِنَ الفَرَسِ، فَلَمَّا جَاءنِي الَّذِي سَمِعْتُ صَوْتَهُ يُبَشِّرُني نَزَعْتُ لَهُ ثَوْبَيَّ، فَكَسَوْتُهُمَا إيَّاهُ بِبِشَارَتِهِ، وَاللهِ مَا أَمْلِكُ غَيْرَهُمَا يَوْمَئِذٍ، وَاسْتَعَرْتُ ثَوْبَيْنِ فَلَبِسْتُهُما، وَانطَلَقْتُ أَتَأَمَّمُ رسولَ الله ﷺ يَتَلَقَّاني النَّاسُ فَوْجًا فَوْجًا يُهَنِّئُونني بالتَّوْبَةِ، وَيقُولُونَ: لِتَهْنِكَ تَوْبَةُ اللهِ عَلَيْكَ. حَتَّى دَخَلْتُ المَسْجِدَ، فَإِذَا رسولُ الله ﷺ حَوْلَهُ النَّاسُ، فَقَامَ طَلْحَةُ بْنُ عُبَيْدِ اللهِ رضي الله عنه يُهَرْوِلُ حَتَّى صَافَحَني وَهَنَّأَني، واللهِ مَا قَامَ رَجُلٌ مِنَ المُهَاجِرينَ غَيْرُهُ. فَكَانَ كَعْبٌ لَا يَنْسَاهَا لِطَلْحَةَ. قَالَ كَعْبٌ: فَلَمَّا سَلَّمْتُ عَلَى رَسُولِ الله ﷺ قَالَ وَهُوَ يَبْرُقُ وَجْهُهُ مِنَ السُّرُورِ: «أَبْشِرْ بِخَيْرِ يَومٍ مَرَّ عَلَيْكَ مُنْذُ وَلَدَتْكَ أُمُّكَ» فَقُلْتُ: أَمِنْ عِنْدِكَ يَا رَسُولَ اللهِ أَمْ مِنْ عِندِ الله؟ قَالَ: «لَا، بَلْ مِنْ عِنْدِ اللهِ» وَكَانَ رسولُ الله ﷺ إِذَا سُرَّ اسْتَنَارَ وَجْهُهُ، حَتَّى كَأَنَّ وَجْهَهُ قِطْعَةُ قَمَرٍ، وَكُنَّا نَعْرِفُ ذلِكَ، فَلَمَّا جَلَسْتُ بَيْنَ يَدَيْهِ قُلْتُ: يَا رسولَ اللهِ، إنَّ مِنْ تَوْبَتِي أَنْ أَنْخَلِعَ مِنْ مَالِي صَدَقَةً إِلَى اللهِ وَإِلَى رَسُولِهِ. فَقَالَ رسولُ الله ﷺ: «أَمْسِكْ بَعْضَ مَالِكَ؛ فَهُوَ خَيْرٌ لَكَ» فقلتُ: إنِّي أُمْسِكُ سَهْمِي الَّذِي بِخَيبَرَ. وَقُلْتُ: يَا رسولَ اللهِ، إنَّ اللهَ تعالى إِنَّمَا أَنْجَانِي بالصِّدْقِ، وإنَّ مِنْ تَوْبَتِي أَلَّا أُحَدِّثَ إلَّا صِدْقًا مَا بَقِيتُ. فَوَاللهِ مَا عَلِمْتُ أَحَدًا مِنَ المُسْلِمينَ أَبْلاهُ اللهُ تعالى في صِدْقِ الحَدِيثِ، مُنْذُ ذَكَرْتُ ذلِكَ ل  list=DATA.q.filter(q=>nums.includes(q.n));if(!list.length){alert('لا توجد أحاديث في هذا النطاق');return}
 if(order=='shuf')shuffle(list);i=0;ok=0;ans=0;wrong=[];

$('start').onclick=()=>{let a=+$('from').value||1,b=+$('to').value||100;if(a>b)[a,b]=[b,a];

 else c.innerHTML=`<div class="hd"><div class="num">${AR(q.n)}</div><div><div class="tt">${esc(q.title)}</div><div class="who">الراوي: ${esc(q.who)}</div></div></div>
 <div class="txt">${fmt(q.pre)}<span class="hide">؟ التخريج</span>${q.pre.length<20?fmt(q.post):(q.post.trim()?' <small class="n">(وبقية كلام المصنف تظهر بعد الإجابة)</small>':'')}</div>`;

function pick(k){
 const q=list[i],g=G[q.k],right=k==q.k;ans++;if(right)ok++;else wrong.push(q.n);

 const c=$('card');c.style.borderRightColor=g.c;
 c.innerHTML=`<div class="hd"><div class="num" style="background:${g.c}">${AR(q.n)}</div><div><div class="tt">${esc(q.title)}</div><div class="who">الراوي: ${esc(q.who)}</div></div></div>
 <div class="txt">${fmt(q.pre)}<mark style="background:${g.l};color:${g.c}">${esc(q.raw)}</mark>${fmt(q.post)}</div>`;
